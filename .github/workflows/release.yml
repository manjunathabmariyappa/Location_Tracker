name: Build and publish release APK

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Android release APK and attaches it to a new GitHub Release
# for that tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      # Firebase web config is client-side identification data (not a secret -
      # access is controlled by Firestore/Storage security rules), so it's safe
      # to bake into the workflow. Expo inlines EXPO_PUBLIC_* vars into the JS
      # bundle at build time, so this file must exist before assembleRelease runs.
      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyBydGIHbm4A5xXDX4v4Qb8q_Odq6CLIc1w
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=family-safety-15944.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=family-safety-15944
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=family-safety-15944.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=786077687056
          EXPO_PUBLIC_FIREBASE_APP_ID=1:786077687056:web:1118315725f81f51245995
          EXPO_PUBLIC_GITHUB_OWNER=manjunathabmariyappa
          EXPO_PUBLIC_GITHUB_REPOSITORY=Location_Tracker
          EOF

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/FamilySafetyTracker-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Family Safety Tracker v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: dist/FamilySafetyTracker-v${{ steps.version.outputs.version }}.apk
